<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Exo+2:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* ====== GLOBAL STYLES ====== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: radial-gradient(circle at 20% 20%, #0b0f1a, #000);
      background-image: url('https://cdn.jsdelivr.net/gh/itscarlosjr/cdn-assets@main/stars-bg.jpg');
      background-size: cover;
      background-attachment: fixed;
      font-family: 'Exo 2', sans-serif;
      color: white;
      overflow: hidden;
    }

    /* ====== NAVBAR ====== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 20px;
      z-index: 10;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-item {
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.85);
      transition: all 0.3s ease;
      text-shadow: 0 0 6px rgba(255,255,255,0.3);
    }

    .nav-item:hover {
      color: #fff;
      transform: translateY(-2px);
      text-shadow: 0 0 12px #9b6dff;
    }

    .nav-item i {
      font-style: normal;
    }

    /* ====== IFRAME AREA ====== */
    #content-frame {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      border: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #content-frame.loaded {
      opacity: 1;
    }

    /* ====== SETTINGS PANEL ====== */
    #settings-panel {
      position: fixed;
      top: 60px;
      right: 0;
      width: 260px;
      height: calc(100% - 60px);
      background: rgba(20, 20, 35, 0.9);
      border-left: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      transform: translateX(100%);
      transition: transform 0.4s ease;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      color: white;
      z-index: 20;
    }

    #settings-panel.open {
      transform: translateX(0);
    }

    #settings-panel h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .setting-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-option button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .setting-option button:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 600px) {
      .nav-item span {
        display: none;
      }
      .nav-item i {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- ====== NAVBAR ====== -->
  <nav>
    <div class="nav-left">
      <div class="nav-item" onclick="loadPage('https://readingsubject.emploi.cl')">
        <i>🪐</i> <span>Petezah</span>
      </div>
      <div class="nav-item" onclick="loadPage('https://mathlookscool.emploi.cl')">
        <i>🌙</i> <span>Shad</span>
      </div>
    </div>

    <div class="nav-right">
      <div class="nav-item" onclick="toggleSettings()">
        <i>⚙️</i> <span>Settings</span>
      </div>
    </div>
  </nav>

  <!-- ====== IFRAME CONTENT ====== -->
  <iframe id="content-frame"></iframe>

  <!-- ====== SETTINGS PANEL ====== -->
  <div id="settings-panel">
    <h3>Settings</h3>
    <div class="setting-option">
      <span>Toggle Theme</span>
      <button>Dark</button>
    </div>
    <div class="setting-option">
      <span>Background Animation</span>
      <button>On</button>
    </div>
    <div class="setting-option">
      <span>Reset Layout</span>
      <button>Reset</button>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("content-frame");
    const settingsPanel = document.getElementById("settings-panel");

    function loadPage(url) {
      iframe.classList.remove("loaded");
      setTimeout(() => {
        iframe.src = url;
      }, 200);
    }

    iframe.addEventListener("load", () => {
      iframe.classList.add("loaded");
    });

    function toggleSettings() {
      settingsPanel.classList.toggle("open");
    }
  </script>
</body>
</html>
